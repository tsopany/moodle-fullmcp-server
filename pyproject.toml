[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fullmcp-server"
version = "0.1.1"
description = "MCP server for Moodle, using the local_fullmcp plugin to build courses, quizzes and content."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tsopany" }]
keywords = ["moodle", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.2.0,<2",  # 2.x renamed FastMCP; port before lifting
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/tsopany/moodle-fullmcp-server"

[project.scripts]
fullmcp-server = "fullmcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["fullmcp_server"]

[tool.hatch.build.targets.sdist]
include = ["fullmcp_server", "README.md", "LICENSE", "pyproject.toml"]
exclude = [".env", "__pycache__", "*.pyc"]
